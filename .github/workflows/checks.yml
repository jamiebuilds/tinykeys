name: checks
on: [push]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run check:types
      - run: npm run check:lint
      - run: npm run check:format
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*
